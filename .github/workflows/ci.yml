name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-and-cli:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: swift test
      - name: Build App and CLI
        run: swift build -c release
      - name: CLI integration checks
        run: python3 scripts/verify_cli.py "$(swift build -c release --show-bin-path)/fralo"
      - name: Public source checks
        run: python3 scripts/check_public_source.py
