# Generated by Plane DevFlow. Execute only trusted default-branch scripts.
name: Plane task sync
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review, converted_to_draft, closed]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: plane-devflow-${{ github.event.pull_request.number || 'connection-check' }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.event_name == 'pull_request_target' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read trusted synchronization scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/plane-devflow
            .plane-devflow.json
          sparse-checkout-cone-mode: false
      - name: Synchronize PR or verify Plane connection
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLANE_API_KEY: ${{ secrets.PLANE_API_KEY }}
          PLANE_CONFIG_SHA: ${{ github.sha }}
        run: python3 .github/plane-devflow/action_runner.py
