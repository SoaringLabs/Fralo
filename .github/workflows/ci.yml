name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.paths.outputs.app }}
      website: ${{ steps.paths.outputs.website }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # Manual runs, new branches and unknown bases check everything.
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "website=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$BASE" HEAD)
          if echo "$changed" | grep -qv '^website/'; then echo "app=true" >> "$GITHUB_OUTPUT"; else echo "app=false" >> "$GITHUB_OUTPUT"; fi
          if echo "$changed" | grep -q '^website/'; then echo "website=true" >> "$GITHUB_OUTPUT"; else echo "website=false" >> "$GITHUB_OUTPUT"; fi

  website:
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/package.json
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - name: Public source checks
        working-directory: .
        run: python3 scripts/check_public_source.py

  # Required check. A job skipped by its condition reports success, so website-only
  # changes do not wait for the macOS build.
  core-and-cli:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Four-language release notes and release gates
        run: |
          python3 -B scripts/release_notes.py check-all
          python3 -B scripts/test_release_notes.py
          python3 -B scripts/test_prepare_update.py
      - name: Select Xcode with macOS 26 SDK
        run: sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
      - name: Toolchain
        run: |
          swift --version
          xcrun --sdk macosx --show-sdk-version
      - name: Localization completeness and guard tests
        run: |
          python3 -B scripts/check_localizations.py
          python3 -B scripts/test_check_localizations.py
      - name: Unit tests
        env:
          FRALO_TEST_ARTIFACTS: ${{ runner.temp }}/fralo-test-artifacts
        run: swift test --build-system native
      - name: Preserve failing output buffers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fralo-output-diagnostics
          path: ${{ runner.temp }}/fralo-test-artifacts
          if-no-files-found: ignore
      - name: Preview process handoff tests
        run: python3 -B scripts/test_stop_preview_processes.py
      - name: Build App and CLI
        run: swift build --build-system native -c release
      - name: CLI integration checks
        run: python3 scripts/verify_cli.py "$(swift build --build-system native -c release --show-bin-path)/fralo"
      - name: Agent CLI contracts and executable documentation
        run: python3 -B scripts/verify_agent_cli.py "$(swift build --build-system native -c release --show-bin-path)/fralo"
      - name: CLI and GUI composition output parity
        run: FRALO_CLI_BINARY="$(swift build --build-system native -c release --show-bin-path)/fralo" swift test --build-system native --skip-build --filter CLICompositionReferenceTests
      - name: Public source checks
        run: python3 scripts/check_public_source.py
